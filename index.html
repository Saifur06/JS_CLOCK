<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="h-screen w-full grid place-items-center">
      <div class=" border-4 p-4 rounded-t-full bg-slate-200  ">
        <div class="mb-4 text-center">
          <h1 class=" text-4xl font-bold" id="time" ></h1>
          <h5 class="  italic text-gray-600 " id="date"> </h5>
        </div>
        <div>
            <ul class=" grid grid-cols-7 text-center gap-2 *:border-2 *:py-1 *:px-3 *:rounded *:cursor-pointer " id="day">
                <li class= "bg-yellow-400" >SUN</li>
                <li class= "bg-yellow-400" >MON</li>
                <li class= "bg-yellow-400">TUE</li>
                <li class= "bg-yellow-400">THU</li>
                <li class= "bg-yellow-400">WED</li>
                <li class= "bg-yellow-400">FRI</li>
                <li class= "bg-yellow-400">SAT</li>
            </ul>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
